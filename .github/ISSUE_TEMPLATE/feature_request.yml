name: Feature request
description: Propose an enhancement to PBX Admin
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: >-
        Describe the operator problem before proposing an implementation.
        Substantial changes should be agreed on before a pull request is
        opened.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What operator or user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior and interface.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe workarounds or other approaches you considered.
  - type: textarea
    id: security
    attributes:
      label: Security and deployment impact
      description: >-
        Note effects on authentication, authorization, proxy behavior, data,
        configuration, or deployment.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and pull requests for this request.
          required: true
        - label: This request contains no secrets or private operational data.
          required: true
