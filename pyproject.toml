[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pbx-admin"
version = "1.0.0a1"
description = "Authenticated PBX admin router for Fly.io private networks"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "Flask==3.0.3",
    "gunicorn==26.0.0",
    "PyJWT[crypto]==2.9.0",
    "requests==2.34.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pbx_admin = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
